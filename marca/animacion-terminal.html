<style>
  :root { --t: #fff; --f: #000; }
  body { margin: 0; min-height: 100vh; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: system-ui, sans-serif; }
  body.claro { --t: #000; --f: #fff; background: #fff; }
  /* Misma ventana del logo definitivo: barra 38, cuerpo 128, borde 6, radio 18 */
  .ventana { width: 172px; box-sizing: border-box; padding: 0 6px 6px; background: var(--t); border-radius: 18px; transition: width .12s linear; }
  .barra { height: 38px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
  .barra i { width: 10px; height: 10px; border-radius: 50%; background: var(--f); display: block; flex: none; }
  .barra span { margin-left: auto; font: 800 20px 'JetBrains Mono'; letter-spacing: -1px; margin-right: 1px; font-variant-ligatures: none; color: var(--f); }
  .cuerpo { position: relative; height: 128px; border-radius: 4px 4px 12px 12px; background: var(--f); overflow: hidden; }
  /* Como en una terminal: las letras aparecen y se corren de golpe, sin animación */
  .l { position: absolute; left: 50%; top: 50%; font: 400 66px Bungee; line-height: 1; color: var(--t); transform: translate(var(--x), -50%); }
  .oculta { visibility: hidden; }
  .cursor { position: absolute; left: 50%; top: 50%; width: 9px; height: 50px; background: var(--t); transform: translate(var(--x), -50%); }
  .cursor.parpadea { animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .medida { position: absolute; visibility: hidden; font: 400 66px Bungee; white-space: pre; }
  button { background: none; border: 1px solid #555; color: #999; border-radius: 999px; padding: 8px 16px; font: 500 13px system-ui; cursor: pointer; }
  body.claro button { border-color: #bbb; color: #666; }
</style>
</head>
<body>
<div class="ventana" id="v">
  <div class="barra"><i></i><i></i><i></i><span>&gt;_</span></div>
  <div class="cuerpo" id="c"></div>
</div>
<button id="tema">Ver sobre blanco</button>
<span class="medida" id="m"></span>
<script>
const ANCHO_ICONO = 172, ANCHO_LOGO = 392
const HUECO = 16 // espacio que ocupa el cursor entre letras
// Cada letra con su identidad (hay dos A); la C del ícono es la misma C del logo
const LETRAS = ['J', 'E', 'A', 'N', 'C', 'A']
const cuerpo = document.getElementById('c'), ventana = document.getElementById('v'), medida = document.getElementById('m')
const espera = ms => new Promise(r => setTimeout(r, ms))
const ancho = txt => { medida.textContent = txt; return medida.getBoundingClientRect().width }

let spans = [], cursor, anchoJC, anchoFinal
function preparar() {
  cuerpo.innerHTML = ''
  spans = LETRAS.map(ch => {
    const s = document.createElement('span')
    s.className = 'l oculta'
    s.textContent = ch
    cuerpo.appendChild(s)
    return s
  })
  cursor = document.createElement('div')
  cursor.className = 'cursor oculta'
  cuerpo.appendChild(cursor)
  anchoJC = ancho('JC')
  anchoFinal = ancho('JEANCA')
}

// Dibuja un estado: qué letras se ven (en orden) y dónde va el cursor (después de cuántas letras)
function pintar(visibles, posCursor) {
  const texto = visibles.map(i => LETRAS[i]).join('')
  // Si el cursor está entre letras, ocupa su propio espacio y empuja lo que sigue
  const hueco = posCursor != null && posCursor < texto.length ? HUECO : 0
  const total = ancho(texto) + hueco
  const x = k => ancho(texto.slice(0, k)) + (hueco && k >= posCursor ? hueco : 0) - total / 2
  visibles.forEach((i, k) => {
    spans[i].style.setProperty('--x', x(k) + 'px')
    spans[i].classList.remove('oculta')
  })
  spans.forEach((s, i) => { if (!visibles.includes(i)) s.classList.add('oculta') })
  // la ventana crece en proporción a lo escrito: ícono con "JC", logo con "JEANCA"
  const t = Math.min(1, (total - anchoJC) / (anchoFinal - anchoJC))
  ventana.style.width = (ANCHO_ICONO + t * (ANCHO_LOGO - ANCHO_ICONO)) + 'px'
  if (posCursor == null) { cursor.classList.add('oculta'); return }
  cursor.classList.remove('oculta')
  cursor.style.setProperty('--x', (ancho(texto.slice(0, posCursor)) - total / 2 + 3) + 'px')
}

async function animar() {
  while (true) {
    // Ícono
    pintar([0, 4], null)
    await espera(1500)
    // Cursor después de la J
    pintar([0, 4], 1)
    cursor.classList.add('parpadea')
    await espera(900)
    cursor.classList.remove('parpadea')
    // Escribe E, A, N empujando la C
    const orden = [0]
    for (const i of [1, 2, 3]) {
      orden.push(i)
      pintar([...orden, 4], orden.length)
      await espera(150 + Math.random() * 90)
    }
    // Salta al final y escribe la última A
    await espera(160)
    pintar([0, 1, 2, 3, 4], 5)
    await espera(200)
    pintar([0, 1, 2, 3, 4, 5], 6)
    cursor.classList.add('parpadea')
    await espera(1700)
    cursor.classList.remove('parpadea')
    // Logo final, sin cursor
    pintar([0, 1, 2, 3, 4, 5], null)
    await espera(2600)
    // Borra hacia atrás (como con la tecla de borrar) y vuelve al ícono
    pintar([0, 1, 2, 3, 4, 5], 6); await espera(250)
    pintar([0, 1, 2, 3, 4], 5); await espera(120)
    pintar([0, 1, 2, 3, 4], 4); await espera(120)
    for (const vis of [[0, 1, 2, 4], [0, 1, 4], [0, 4]]) {
      pintar(vis, vis.length - 1)
      await espera(90)
    }
    await espera(250)
  }
}

document.getElementById('tema').onclick = e => {
  document.body.classList.toggle('claro')
  e.target.textContent = document.body.classList.contains('claro') ? 'Ver sobre negro' : 'Ver sobre blanco'
}

// Pedir la fuente antes de medir (si no hay letras en pantalla el navegador no la descarga)
const fuentes = Promise.all([document.fonts.load('66px Bungee', 'JEANCA'), document.fonts.load("800 20px 'JetBrains Mono'", '>_')])
const etapa = new URLSearchParams(location.search).get('etapa') // capturas fijas para revisar
fuentes.then(() => {
  preparar()
  if (etapa) {
    ventana.style.transition = 'none'
    const estados = { icono: [[0, 4], null], escribiendo: [[0, 1, 2, 4], 3], final: [[0, 1, 2, 3, 4, 5], null] }
    pintar(...estados[etapa])
    return
  }
  animar()
})
</script>
</body>
</html>
